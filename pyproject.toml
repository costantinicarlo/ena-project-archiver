[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ena-project-archiver"
version = "0.1.0"
description = "Reproducible archival acquisition of ENA raw-read projects"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Carlo Costantini"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.scripts]
ena-project = "ena_project.cli:entrypoint"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
