name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live_ena_schema:
        description: Run the opt-in ENA returnFields schema smoke test
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[dev]'
      - run: python -m pytest
      - run: ruff check src tests

  live-ena-schema:
    if: github.event_name == 'workflow_dispatch' && inputs.live_ena_schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install '.[dev]'
      - run: python -m pytest tests/test_ena_client.py -k live_required
        env:
          ENA_LIVE_SCHEMA_TEST: "1"
